<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<style>
  /* ============================================================
     Firstbase brand system
     navy #030e24 · blue #5bb5fd · coral #f46e73 · steel #5d646c
     ============================================================ */
  :root {
    --fb-navy: #030e24;
    --fb-navy-2: #0a1730;
    --fb-blue: #5bb5fd;
    --fb-blue-deep: #4264d1;
    --fb-blue-2: #6ce2ff;
    --fb-coral: #f46e73;
    --fb-purple: #9e77ed;
    --fb-purple-soft: #f4ebff;
    --fb-blue-soft: #eff8ff;
    --fb-bg: #ffffff;
    --fb-bg-soft: #f9fafb;
    --fb-bg-2: #f2f4f7;
    --fb-border: #e4ebf3;
    --fb-border-2: #dee5ee;
    --fb-text: #030e24;
    --fb-text-2: #5d646c;
    --fb-text-3: #74889d;
    --fb-good: #16b06a;
    --fb-good-soft: #e6f6ee;
    --fb-warn: #d59024;
    --fb-warn-soft: #fff5e2;
    --fb-bad: #f46e73;
    --fb-bad-soft: #fde7e8;
    --fb-shadow: 0 1px 2px rgba(3, 14, 36, 0.04), 0 4px 12px rgba(3, 14, 36, 0.06);
    --fb-shadow-lg: 0 8px 24px rgba(3, 14, 36, 0.08), 0 2px 6px rgba(3, 14, 36, 0.04);
    --fb-radius: 14px;
    --fb-radius-sm: 10px;
    --fb-font: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: var(--fb-font);
    color: var(--fb-text);
    background: var(--fb-bg-soft);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "ss01","cv11";
    letter-spacing: -0.005em;
  }

  /* ============== Top nav (Firstbase-style) ============== */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    background: var(--fb-bg);
    border-bottom: 1px solid var(--fb-border);
    height: 64px;
    display: flex; align-items: center; padding: 0 28px; gap: 24px;
  }
  .logo {
    display: inline-flex; align-items: center;
    text-decoration: none;
  }
  .logo svg {
    height: 26px; width: auto; display: block;
  }
  .logo .wordmark { fill: var(--fb-navy); }
  .logo .mark { fill: var(--fb-coral); }
  .nav-divider { width: 1px; height: 22px; background: var(--fb-border); }
  .nav-title {
    font-size: 14px; color: var(--fb-text-2); font-weight: 500;
  }
  .nav-title b { color: var(--fb-text); font-weight: 600; }
  .nav-spacer { flex: 1; }
  .nav-status {
    display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fb-text-2);
    padding: 6px 12px; border-radius: 999px; background: var(--fb-bg-soft);
    border: 1px solid var(--fb-border);
  }
  .nav-status .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--fb-good); animation: pulse-dot 2s infinite;
    box-shadow: 0 0 0 0 rgba(22, 176, 106, 0.45);
  }
  .nav-status.loading .dot { background: var(--fb-warn); }
  .nav-status.error .dot { background: var(--fb-bad); animation: none;}
  @keyframes pulse-dot {
    0% { box-shadow: 0 0 0 0 rgba(22, 176, 106, 0.45); }
    70% { box-shadow: 0 0 0 6px rgba(22, 176, 106, 0); }
    100% { box-shadow: 0 0 0 0 rgba(22, 176, 106, 0); }
  }
  .nav-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--fb-navy); color: white; border: 0;
    padding: 8px 14px; border-radius: 8px;
    font-size: 13px; font-weight: 600; font-family: inherit;
    cursor: pointer; letter-spacing: -0.005em;
    transition: background .15s ease, transform .15s ease;
  }
  .nav-btn:hover { background: #0a1730; transform: translateY(-1px); }
  .nav-btn.ghost { background: transparent; color: var(--fb-text); border: 1px solid var(--fb-border); }
  .nav-btn.ghost:hover { background: var(--fb-bg-soft); }

  /* ============== Sub-header summary ============== */
  .sub-head {
    position: fixed; top: 64px; left: 0; right: 0; z-index: 15;
    background: var(--fb-bg);
    border-bottom: 1px solid var(--fb-border);
    padding: 16px 28px;
  }
  .sub-head-inner { display: flex; gap: 14px; align-items: stretch; flex-wrap: wrap; }
  .pageTitle {
    display: flex; flex-direction: column; gap: 2px; padding-right: 18px;
    border-right: 1px solid var(--fb-border); margin-right: 6px;
  }
  .pageTitle h1 {
    margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: var(--fb-navy);
  }
  .pageTitle .updated { font-size: 11px; color: var(--fb-text-3); }
  .summary { display: flex; gap: 24px; flex: 1; flex-wrap: wrap; align-items: stretch; }
  .summary-group { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 320px; }
  .summary-group-head {
    display: flex; align-items: center; gap: 8px;
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    font-weight: 700;
  }
  .summary-group.global-group .summary-group-head { color: var(--fb-navy); }
  .summary-group.regional-group .summary-group-head { color: var(--fb-blue-deep); }
  .summary-group-head .lead-rule {
    flex: 1; height: 1px; background: currentColor; opacity: 0.18;
  }
  .summary-cards-row { display: flex; gap: 10px; }

  /* Inline SVG icons */
  .ico {
    width: 14px; height: 14px; display: inline-block; vertical-align: -2px;
    flex-shrink: 0;
  }
  .ico.lg { width: 18px; height: 18px; vertical-align: -3px; }
  .ico.sm { width: 12px; height: 12px; }

  /* Region letter badges — enterprise-style identity tags */
  .region-badge {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 3px 8px; border-radius: 5px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    background: var(--fb-bg-2); color: var(--fb-navy);
    border: 1px solid var(--fb-border);
    vertical-align: middle; white-space: nowrap;
  }
  .region-badge.global {
    background: var(--fb-navy); color: white; border: 0;
    padding: 3px 10px;
  }
  .panel-region-name .region-badge {
    font-size: 11px; padding: 4px 10px;
  }
  .summary-card.global .region-badge.global {
    background: rgba(255, 255, 255, 0.14);
    color: white;
  }

  .summary-card {
    background: var(--fb-bg);
    border: 1px solid var(--fb-border);
    border-radius: var(--fb-radius);
    padding: 12px 16px;
    min-width: 180px;
    flex: 1;
    transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .summary-card:hover { border-color: #cdd7e3; box-shadow: var(--fb-shadow); transform: translateY(-1px); }
  .summary-card .scope {
    font-size: 10px; letter-spacing: 0.14em;
    color: var(--fb-text-3); text-transform: uppercase; font-weight: 700;
  }
  .summary-card .label { font-size: 12px; color: var(--fb-text-2); margin-top: 2px; font-weight: 500;}
  .summary-card .value-row {
    display: flex; align-items: baseline; gap: 8px; margin-top: 4px;
  }
  .summary-card .value {
    font-size: 26px; font-weight: 700; letter-spacing: -0.025em; color: var(--fb-text);
    font-variant-numeric: tabular-nums;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 999px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.02em;
  }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; }
  .pill.good { background: var(--fb-good-soft); color: var(--fb-good); }
  .pill.good::before { background: var(--fb-good); }
  .pill.warn { background: var(--fb-warn-soft); color: var(--fb-warn); }
  .pill.warn::before { background: var(--fb-warn); }
  .pill.bad  { background: var(--fb-bad-soft); color: var(--fb-bad); }
  .pill.bad::before  { background: var(--fb-bad); }
  .summary-card .footnote { font-size: 11px; color: var(--fb-text-3); margin-top: 4px;}
  .summary-card .footnote.days-line {
    color: var(--fb-navy); font-weight: 600;
    display: inline-flex; align-items: center; gap: 5px;
  }

  /* Global cards — "executive" / hero treatment: solid navy on white page */
  .summary-card.global {
    background: linear-gradient(135deg, #030e24 0%, #0a1730 60%, #122452 100%);
    border-color: transparent;
    color: white;
    position: relative; overflow: hidden;
  }
  .summary-card.global::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(122, 162, 255, 0.07) 1px, transparent 1px);
    background-size: 12px 12px;
  }
  .summary-card.global > * { position: relative; z-index: 1; }
  .summary-card.global .scope { color: var(--fb-blue); }
  .summary-card.global .label { color: rgba(255, 255, 255, 0.74); }
  .summary-card.global .footnote { color: rgba(255, 255, 255, 0.55); }
  .summary-card.global .footnote.days-line { color: var(--fb-blue-2); }
  .summary-card.global .pill.good { background: rgba(46, 229, 164, 0.16); color: #4be3a6; }
  .summary-card.global .pill.warn { background: rgba(255, 193, 77, 0.18); color: #ffd278; }
  .summary-card.global .pill.bad  { background: rgba(255, 130, 134, 0.18); color: #ff9094; }
  .summary-card.global:hover {
    border-color: transparent;
    box-shadow: 0 10px 30px rgba(3, 14, 36, 0.25);
  }

  /* Regional cards — "operational" treatment: white with blue accent bar */
  .summary-card.regional {
    background: var(--fb-bg);
    border-left: 3px solid var(--fb-blue);
  }
  .summary-card.regional:hover {
    border-color: var(--fb-blue);
    border-left-color: var(--fb-blue);
  }

  /* ============== Globe ============== */
  main { position: absolute; inset: 0; padding-top: 188px; padding-bottom: 0; }
  #globe { width: 100%; height: calc(100vh - 188px); cursor: grab; display: block; }
  #globe:active { cursor: grabbing; }

  .controls {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; z-index: 5;
    background: var(--fb-bg);
    border: 1px solid var(--fb-border);
    border-radius: 999px; padding: 4px;
    box-shadow: var(--fb-shadow);
  }
  .controls button {
    background: transparent; border: 0; color: var(--fb-text-2);
    padding: 8px 16px; border-radius: 999px; cursor: pointer;
    font-size: 12px; font-weight: 600; font-family: inherit;
    transition: background .15s ease, color .15s ease;
    letter-spacing: -0.005em;
  }
  .controls button:hover { color: var(--fb-text); background: var(--fb-bg-soft); }
  .controls button.active { background: var(--fb-navy); color: white; }

  .legend {
    position: fixed; left: 22px; bottom: 22px; z-index: 5;
    background: var(--fb-bg); border: 1px solid var(--fb-border);
    border-radius: var(--fb-radius); padding: 12px 14px;
    font-size: 11px; color: var(--fb-text-2); max-width: 240px;
    box-shadow: var(--fb-shadow);
  }
  .legend strong {
    color: var(--fb-text); display: block; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 8px; font-weight: 700;
  }
  .legend-row { display: flex; align-items: center; gap: 8px; margin-top: 4px;}
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;}
  .legend-good { background: var(--fb-good); }
  .legend-warn { background: var(--fb-warn); }
  .legend-bad  { background: var(--fb-bad); }
  .legend-hint { color: var(--fb-text-3); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--fb-border); }

  .floating-pill {
    position: fixed; right: 22px; bottom: 22px; z-index: 5;
    font-size: 11px; color: var(--fb-text-3);
    background: var(--fb-bg); border: 1px solid var(--fb-border);
    border-radius: 999px; padding: 6px 14px;
    box-shadow: var(--fb-shadow);
  }

  /* ============== Side panel ============== */
  aside.panel {
    position: fixed; top: 64px; right: 0; bottom: 0;
    width: 460px; max-width: 100%;
    background: var(--fb-bg);
    border-left: 1px solid var(--fb-border);
    transform: translateX(100%);
    transition: transform .35s cubic-bezier(0.22, 1, 0.36, 1);
    overflow-y: auto;
    z-index: 18;
    box-shadow: -8px 0 24px rgba(3, 14, 36, 0.06);
  }
  aside.panel.open { transform: translateX(0); }
  .panel-head {
    padding: 24px 26px 14px; border-bottom: 1px solid var(--fb-border);
    background: var(--fb-bg);
    position: sticky; top: 0; z-index: 2;
  }
  .panel-region-name {
    font-size: 26px; font-weight: 800; letter-spacing: -0.025em;
    display: flex; align-items: center; gap: 10px; color: var(--fb-navy);
  }
  .panel-region-sub {
    font-size: 13px; color: var(--fb-text-2); margin-top: 4px; font-weight: 500;
  }
  .panel-pillrow { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap;}
  .panel-close {
    position: absolute; top: 16px; right: 18px;
    background: var(--fb-bg-soft); border: 1px solid var(--fb-border); color: var(--fb-text);
    width: 30px; height: 30px; border-radius: 8px; cursor: pointer;
    display: grid; place-items: center; font-size: 18px; line-height: 1;
    transition: background .15s ease;
  }
  .panel-close:hover { background: var(--fb-bg-2); }

  .metric-block {
    margin: 16px 26px;
    border: 1px solid var(--fb-border);
    border-radius: var(--fb-radius);
    overflow: hidden;
    background: var(--fb-bg);
  }
  .metric-block.cth { border-color: rgba(91, 181, 253, 0.35); }
  .metric-block.dts { border-color: rgba(158, 119, 237, 0.30); }
  .metric-block.cts { border-color: var(--fb-border); }
  .metric-head {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--fb-border);
    background: var(--fb-bg-soft);
  }
  .metric-block.cth .metric-head { background: var(--fb-blue-soft); border-bottom-color: rgba(91, 181, 253, 0.25); }
  .metric-block.dts .metric-head { background: var(--fb-purple-soft); border-bottom-color: rgba(158, 119, 237, 0.20); }

  .metric-title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .metric-title { font-weight: 700; font-size: 15px; color: var(--fb-navy); letter-spacing: -0.01em;}
  .metric-title .short { color: var(--fb-text-3); font-weight: 500; margin-left: 6px; }
  .metric-desc { font-size: 12px; color: var(--fb-text-2); margin-top: 2px; }
  .metric-slo {
    font-size: 11px; color: var(--fb-text-2); margin-top: 8px;
    display: inline-flex; gap: 6px; align-items: center;
    background: white; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--fb-border);
  }
  .metric-slo b { color: var(--fb-navy); font-weight: 600; }

  /* Actuals strip (days vs SLO) */
  .actuals-strip {
    padding: 14px 18px 14px;
    background: var(--fb-bg);
    border-bottom: 1px solid var(--fb-border);
  }
  .actuals-strip .actuals-label {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--fb-text-3); font-weight: 700; margin-bottom: 8px;
  }
  .actuals-row {
    display: flex; align-items: stretch; gap: 14px;
  }
  .actuals-card {
    flex: 1; padding: 10px 12px;
    background: var(--fb-bg-soft); border: 1px solid var(--fb-border);
    border-radius: var(--fb-radius-sm);
  }
  .actuals-card.actual { background: linear-gradient(135deg, var(--fb-blue-soft), white); border-color: rgba(91, 181, 253, 0.4);}
  .actuals-card .a-label {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--fb-text-3); font-weight: 700;
  }
  .actuals-card .a-value {
    font-size: 24px; font-weight: 800; letter-spacing: -0.025em;
    color: var(--fb-navy); margin-top: 2px;
    font-variant-numeric: tabular-nums;
    display: flex; align-items: baseline; gap: 6px;
  }
  .actuals-card .a-unit {
    font-size: 13px; font-weight: 600; color: var(--fb-text-2);
  }
  .actuals-card .a-foot {
    font-size: 10px; color: var(--fb-text-3); margin-top: 2px;
  }
  .vs-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: -0.005em;
    align-self: center;
  }
  .vs-pill.beat { background: var(--fb-good-soft); color: var(--fb-good); }
  .vs-pill.miss { background: var(--fb-bad-soft); color: var(--fb-bad); }
  .vs-pill.warn { background: var(--fb-warn-soft); color: var(--fb-warn); }

  .days-bar {
    margin-top: 12px; position: relative; height: 8px;
    background: var(--fb-bg-2); border-radius: 999px; overflow: visible;
  }
  .days-bar .slo-zone {
    position: absolute; top: 0; bottom: 0;
    background: rgba(22, 176, 106, 0.18);
    border-left: 2px solid rgba(22, 176, 106, 0.55);
    border-right: 2px solid rgba(22, 176, 106, 0.55);
  }
  .days-bar .actual-marker {
    position: absolute; top: -3px; bottom: -3px; width: 3px;
    background: var(--fb-navy); border-radius: 2px;
    box-shadow: 0 0 0 2px white;
  }
  .days-bar-axis {
    display: flex; justify-content: space-between;
    margin-top: 4px; font-size: 9px; color: var(--fb-text-3);
    font-variant-numeric: tabular-nums;
  }

  /* Region stats grid (volume + countries + warehouses) */
  .region-stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    margin: 16px 26px;
  }
  .stat-card {
    padding: 12px 14px;
    background: var(--fb-bg); border: 1px solid var(--fb-border);
    border-radius: var(--fb-radius-sm);
    min-height: 86px;
  }
  .stat-card.volume {
    background: linear-gradient(135deg, var(--fb-blue-soft), white);
    border-color: rgba(91, 181, 253, 0.4);
  }
  .stat-card.muted { background: var(--fb-bg-soft); }
  .stat-card .stat-label {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--fb-text-3); font-weight: 700;
  }
  .stat-card .stat-value {
    font-size: 24px; font-weight: 800; letter-spacing: -0.025em;
    color: var(--fb-navy); margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .stat-card .stat-foot {
    font-size: 10px; color: var(--fb-text-3); margin-top: 4px;
    line-height: 1.3; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }

  /* Countries + warehouses lists */
  .region-extras { padding: 14px 18px 18px; background: var(--fb-bg); }
  .extras-head {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--fb-text-3); font-weight: 700; margin: 10px 0 8px;
  }
  .extras-head:first-child { margin-top: 0; }
  .country-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .country-chip {
    display: inline-flex; align-items: center;
    padding: 4px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 500; color: var(--fb-text);
    background: var(--fb-bg-soft); border: 1px solid var(--fb-border);
    transition: background .15s ease, border-color .15s ease;
  }
  .country-chip.active {
    background: var(--fb-navy); color: white; border-color: var(--fb-navy);
  }
  .wh-list { display: flex; flex-direction: column; gap: 4px; }
  .wh-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: var(--fb-radius-sm);
    background: var(--fb-bg-soft); border: 1px solid var(--fb-border);
  }
  .wh-item.active {
    background: var(--fb-blue-soft); border-color: rgba(91,181,253,0.5);
  }
  .wh-item .wh-pin {
    width: 24px; height: 24px; display: inline-flex;
    align-items: center; justify-content: center;
    color: var(--fb-blue-deep);
    background: var(--fb-blue-soft); border-radius: 6px;
  }
  .wh-item .wh-pin .ico { width: 14px; height: 14px; vertical-align: 0; }
  .wh-item.active .wh-pin { color: white; background: var(--fb-navy); }

  .legend-hint .ico { color: var(--fb-blue-deep); margin-right: 4px; }
  .wh-item b { font-size: 12px; font-weight: 600; color: var(--fb-text); display: block; }
  .wh-item .wh-country {
    font-size: 10px; color: var(--fb-text-3); font-weight: 500;
  }
  .metric-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 0;
  }
  .metric-cell {
    padding: 14px 12px; text-align: left; border-right: 1px solid var(--fb-border);
  }
  .metric-cell:last-child { border-right: 0; }
  .metric-cell .cell-label {
    font-size: 10px; color: var(--fb-text-3); text-transform: uppercase;
    letter-spacing: 0.1em; font-weight: 700;
  }
  .metric-cell .cell-value {
    font-size: 22px; font-weight: 700; letter-spacing: -0.025em;
    margin-top: 4px; font-variant-numeric: tabular-nums; color: var(--fb-text);
    display: flex; align-items: baseline; gap: 6px;
  }
  .delta { font-size: 11px; font-weight: 600; }
  .delta.up { color: var(--fb-good); }
  .delta.down { color: var(--fb-bad); }
  .metric-cell .cell-foot { font-size: 10px; color: var(--fb-text-3); margin-top: 2px;}

  .bar-block { padding: 0 18px 16px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .bar-row-label {
    font-size: 11px; color: var(--fb-text-2); width: 88px; flex-shrink: 0; font-weight: 600;
  }
  .bar-track {
    flex: 1; height: 6px; border-radius: 999px;
    background: var(--fb-bg-2); overflow: hidden; position: relative;
  }
  .bar-track::after {
    content: ""; position: absolute; left: 95%; top: -3px; bottom: -3px; width: 1px;
    background: var(--fb-text-3); opacity: 0.35;
  }
  .bar-fill { height: 100%; border-radius: 999px; transition: width .5s cubic-bezier(0.22, 1, 0.36, 1);}
  .bar-row-value {
    font-size: 12px; color: var(--fb-text); width: 56px; text-align: right;
    flex-shrink: 0; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .bar-target-label { font-size: 9px; color: var(--fb-text-3); margin-top: 2px; padding-left: 98px; }

  /* ============== Tooltip & pins ============== */
  .tooltip {
    position: fixed; pointer-events: none;
    background: var(--fb-navy); color: white;
    border-radius: var(--fb-radius-sm); padding: 12px 14px;
    font-size: 12px; transform: translate(-50%, calc(-100% - 14px));
    box-shadow: 0 12px 24px rgba(3, 14, 36, 0.18);
    opacity: 0; transition: opacity .12s ease;
    min-width: 180px; z-index: 30;
  }
  .tooltip::after {
    content: ""; position: absolute; left: 50%; bottom: -5px;
    transform: translateX(-50%) rotate(45deg);
    width: 10px; height: 10px; background: var(--fb-navy);
  }
  .tooltip.show { opacity: 1; }
  .tooltip .ttl { font-weight: 700; font-size: 13px; letter-spacing: -0.01em; }
  .tooltip .row { display:flex; justify-content:space-between; gap:12px; color: rgba(255,255,255,0.7); margin-top: 4px;}
  .tooltip .row b { color: white; font-weight: 600;}
  .tooltip .hint { font-size: 10px; color: var(--fb-blue-2); margin-top: 8px; opacity: 0.8;}

  .country-base { fill: #e9eef5; stroke: #cfd8e3; stroke-width: 0.5; }
  .country-served { fill: #c2d8eb; stroke: #94aac4; stroke-width: 0.4; cursor: pointer; transition: fill .15s ease; }
  .country-served:hover { fill: var(--fb-blue); }
  .country-active { fill: var(--fb-navy) !important; stroke: var(--fb-navy) !important;}
  .graticule { fill: none; stroke: rgba(3, 14, 36, 0.05); stroke-width: 0.5; }
  .ocean { fill: var(--fb-blue-soft); stroke: rgba(3, 14, 36, 0.10); stroke-width: 0.7; }

  .pin g { cursor: pointer; }
  .pin-shadow { fill: rgba(3, 14, 36, 0.12); }
  .pin-ring {
    fill: none; stroke: currentColor; stroke-width: 1.5; opacity: 0.5;
    transform-origin: center;
    animation: pulse 2.4s ease-out infinite;
  }
  @keyframes pulse {
    0% { transform: scale(0.7); opacity: 0.7; }
    100% { transform: scale(2.6); opacity: 0; }
  }

  /* ============== Loading shimmer ============== */
  .skeleton {
    background: linear-gradient(90deg, var(--fb-bg-2) 0%, var(--fb-bg) 50%, var(--fb-bg-2) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite linear;
    border-radius: 6px;
    color: transparent !important;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .toast {
    position: fixed; top: 76px; right: 22px;
    background: var(--fb-navy); color: white;
    padding: 10px 16px; border-radius: var(--fb-radius-sm);
    font-size: 12px; font-weight: 500;
    box-shadow: var(--fb-shadow-lg);
    z-index: 50; opacity: 0;
    transform: translateY(-8px);
    transition: opacity .25s ease, transform .25s ease;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { background: var(--fb-bad); }

  @media (max-width: 1100px) { aside.panel { width: 400px; } }
  @media (max-width: 900px) {
    .nav { padding: 0 16px; }
    .sub-head { padding: 12px 16px; }
    .pageTitle { padding-right: 0; border-right: 0; margin-right: 0; }
    .summary-card { min-width: 140px; padding: 10px 12px; }
    .summary-card .value { font-size: 20px; }
    aside.panel { width: 100%; top: 64px; }
    main { padding-top: 230px; }
    #globe { height: calc(100vh - 230px); }
  }
</style>
</head>

// Cell helpers: gviz cells are { v: rawValue, f: formattedString } | null
function cellStr(c) {
  if (!c) return "";
  if (c.v == null) return "";
  return String(c.v).trim();
}
function cellPct(c) {
  // Returns 0-100 number or null. Sheet stores percentages as decimals (0.95).
  if (!c) return null;
  const v = c.v;
  if (v == null || v === "" || v === "---" || v === "#DIV/0!" || v === "#N/A") return null;
  if (typeof v === "number") return v <= 1.5 ? v * 100 : v; // decimals -> %
  if (typeof v === "string") {
    if (!v.trim()) return null;
    const m = v.match(/(-?\d+(?:\.\d+)?)\s*%?/);
    if (!m) return null;
    const n = parseFloat(m[1]);
    return v.includes("%") || n > 1.5 ? n : n * 100;
  }
  return null;
}

function fetchSheetJSONP(gid = GID, timeoutMs = 15000) {
  return new Promise((resolve, reject) => {
    const cb = "fbgviz_" + Math.random().toString(36).slice(2);
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq` +
      `?tqx=out:json;responseHandler:${cb};reqId:0` +
      `&gid=${gid}&headers=0&_=${Date.now()}`;
    const script = document.createElement("script");
    let done = false;
    const cleanup = () => {
      if (done) return; done = true;
      try { delete window[cb]; } catch (_) { window[cb] = undefined; }
      script.remove();
      clearTimeout(timer);
    };
    window[cb] = (payload) => {
      cleanup();
      if (!payload || payload.status !== "ok") {
        reject(new Error("gviz status: " + (payload && payload.status)));
        return;
      }
      resolve(payload);
    };
    script.onerror = () => {
      cleanup();
      reject(new Error("Script load failed (network/blocked)"));
    };
    const timer = setTimeout(() => {
      cleanup();
      reject(new Error(`Timed out after ${timeoutMs/1000}s`));
    }, timeoutMs);
    script.src = url;
    script.async = true;
    document.head.appendChild(script);
  });
}

function findSummaryColumnsJSON(rows) {
  // Look in the first ~10 rows for cells with "Final" / "YTD" text values.
  let finalCol = null, ytdCol = null;
  for (let r = 0; r < Math.min(12, rows.length); r++) {
    const cells = rows[r].c || [];
    for (let c = 0; c < cells.length; c++) {
      const v = cellStr(cells[c]);
      if (v === "Final" && finalCol == null) finalCol = c;
      if (v === "YTD" && ytdCol == null) ytdCol = c;
    }
    if (finalCol != null && ytdCol != null) break;
  }
  return { finalCol, ytdCol };
}

function rolling3wAvgJSON(cells, weeklyStart, weeklyEnd) {
  const vals = [];
  for (let c = weeklyEnd; c >= weeklyStart && vals.length < 3; c--) {
    const pv = cellPct(cells[c]);
    if (pv != null) vals.push(pv);
  }
  if (!vals.length) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

/* Merge data from the CTH Averages tab (pivot + reference table).
   Sets per-region: cth.avgDays (3-week pivot total) and cth.sloDaysLabel (e.g. "5-8"). */
function mergeCTHAverages(data, payload) {
  if (!payload || !payload.table) return;
  const rows = payload.table.rows || [];

  const totalToRegion = {
    "US Total": "US", "UK Total": "UK", "EU Total": "EU",
    "Canada Total": "Canada", "India Total": "India",
    "APAC Total": "APAC", "LATAM Total": "LATAM",
    "Grand Total": "Global"
  };
  const geoToRegion = {
    "US": "US", "UK": "UK", "EU": "EU", "CA": "Canada",
    "IN": "India", "APAC": "APAC", "LATAM": "LATAM"
  };

  // Region averages — from pivot. Look for "X Total" rows in col 0,
  // then take the rightmost numeric cell within cols 2..10 (Grand Total col).
  for (const r of rows) {
    const cells = r.c || [];
    const c0 = cellStr(cells[0]);
    const region = totalToRegion[c0];
    if (!region || !data[region]) continue;
    let avg = null;
    for (let j = Math.min(10, cells.length - 1); j >= 2; j--) {
      const c = cells[j];
      if (c && typeof c.v === "number") { avg = c.v; break; }
    }
    if (avg != null) data[region].cth.avgDays = avg;
  }

  // Region SLO ranges — from right reference table at cols 7-9.
  // Use cell.f (formatted) since ranges like "5-8" get auto-coerced to dates in cell.v.
  for (let i = 0; i < Math.min(15, rows.length); i++) {
    const cells = rows[i].c || [];
    const geo = cellStr(cells[7]);
    const region = geoToRegion[geo];
    if (!region || !data[region]) continue;
    const slo = cells[8];
    if (!slo) continue;
    const label = (slo.f || slo.v || "").toString().trim();
    if (label) data[region].cth.sloDaysLabel = label;
  }
  // Global has no single SLO target; use the standard CTH window (5–8 days)
  // — matches Firstbase's published SLO outside a few remote-region exceptions.
  if (data.Global) data.Global.cth.sloDaysLabel = data.Global.cth.sloDaysLabel || "5–8";
}

/* For each multi-source display region (NA, EU, APAC), combine the per-source-region
   CTH avg days and SLO range labels that mergeCTHAverages set on sourceData. */
function mergeCTHAveragesForDisplay(displayData, sourceData) {
  for (const [regionKey, region] of Object.entries(displayData)) {
    if (regionKey === "Global") continue;
    const meta = DISPLAY_REGIONS[regionKey];
    if (!meta || !meta.sheetSources.length) continue;
    const sources = meta.sheetSources.map(k => sourceData[k]).filter(Boolean);

    // Volume-weighted avg days
    const weights = sources.map(s => s.volume?.ytd || 0);
    const totalW = weights.reduce((a, b) => a + b, 0);
    let avgDays = null;
    if (totalW) {
      let acc = 0, used = 0;
      sources.forEach((s, i) => {
        const v = s.cth?.avgDays;
        if (v != null) { acc += v * weights[i]; used += weights[i]; }
      });
      avgDays = used ? acc / used : null;
    } else {
      const vals = sources.map(s => s.cth?.avgDays).filter(v => v != null);
      avgDays = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
    }

    // Union of SLO day ranges across sources
    let minD = Infinity, maxD = -Infinity;
    for (const s of sources) {
      const rng = parseSloRange(s.cth?.sloDaysLabel);
      if (rng) { minD = Math.min(minD, rng.min); maxD = Math.max(maxD, rng.max); }
    }
    const sloLabel = (minD !== Infinity)
      ? (minD === maxD ? String(minD) : `${minD}–${maxD}`)
      : null;

    region.cth.avgDays = avgDays;
    region.cth.sloDaysLabel = sloLabel;
  }
  // ME default — Firstbase standard CTH window, since the sheet doesn't track ME yet
  if (displayData.ME && displayData.ME.cth.sloDaysLabel == null) {
    displayData.ME.cth.sloDaysLabel = "5–8";
  }
}

/* Read a raw numeric count cell (volume rows store integer counts, not percentages). */
function cellCount(c) {
  if (!c) return null;
  const v = c.v;
  if (v == null || v === "" || v === "---") return null;
  if (typeof v === "number") return v;
  if (typeof v === "string") {
    const n = parseFloat(v.replace(/,/g, ""));
    return isNaN(n) ? null : n;
  }
  return null;
}

function extractDataFromJSON(payload) {
  const tbl = payload.table;
  if (!tbl || !Array.isArray(tbl.rows)) throw new Error("Malformed gviz table");
  const rows = tbl.rows;

  let { finalCol, ytdCol } = findSummaryColumnsJSON(rows);
  if (finalCol == null || ytdCol == null) {
    const colCount = (tbl.cols || []).length || (rows[0]?.c || []).length || 143;
    ytdCol = colCount - 1;
    finalCol = colCount - 2;
    console.warn("Final/YTD labels not found — falling back to last-2 columns:", { finalCol, ytdCol, colCount });
  }
  const weeklyStart = 2;
  const weeklyEnd = Math.max(weeklyStart, finalCol - 36);

  // Find region anchors (col 0 == sheet region key).
  const anchors = [];
  for (let r = 0; r < rows.length; r++) {
    const k = cellStr((rows[r].c || [])[0]);
    if (SOURCE_REGION_KEYS.includes(k)) anchors.push({ key: k, row: r });
  }

  /* For each region anchor, find indices of:
       - CTS / CTH / DTS % (Net) rows  → SLO percentages
       - "Items Delivered from WH (Gross)" row → volume (delivered orders)
       - "Items Shipped from WH (Gross)" row   → shipped count (used as fallback) */
  function findRowsForRegion(start, end) {
    const found = { cts: null, cth: null, dts: null, delivered: null, shipped: null, returns: null };
    for (let r = start; r < end; r++) {
      const lab = cellStr((rows[r].c || [])[1]);
      if (lab === "CTS % (Net)" && found.cts == null) found.cts = r;
      else if (lab === "CTH % (Net)" && found.cth == null) found.cth = r;
      else if (lab === "DTS % (Net)" && found.dts == null) found.dts = r;
      else if (lab === "Items Delivered from WH (Gross)" && found.delivered == null) found.delivered = r;
      else if (lab === "Items Shipped from WH (Gross)" && found.shipped == null) found.shipped = r;
      else if (lab === "Returns Completed (Gross)" && found.returns == null) found.returns = r;
    }
    return found;
  }
  const regions = {};
  for (let i = 0; i < anchors.length; i++) {
    const a = anchors[i];
    const nextA = anchors[i + 1];
    const nextRow = nextA ? nextA.row : rows.length;
    const win = Math.min(nextRow, a.row + 50);
    const m = findRowsForRegion(a.row, win);
    if (m.cth != null && !regions[a.key]) regions[a.key] = { anchor: a.row, ...m };
  }

  const out = {};
  for (const key of SOURCE_REGION_KEYS) {
    const r = regions[key];
    const region = { key };
    if (!r) {
      region.cts = region.cth = region.dts = { rolling3w: null, ytd: null, previousFY: null };
      region.volume = { ytd: null, previousFY: null };
      out[key] = region;
      continue;
    }
    for (const metric of ["cts", "cth", "dts"]) {
      const ri = r[metric];
      if (ri == null) { region[metric] = { rolling3w: null, ytd: null, previousFY: null }; continue; }
      const cells = rows[ri].c || [];
      region[metric] = {
        rolling3w:  rolling3wAvgJSON(cells, weeklyStart, weeklyEnd),
        ytd:        cellPct(cells[ytdCol]),
        previousFY: cellPct(cells[finalCol])
      };
    }
    // Volume = items delivered YTD; fall back to shipped if delivered missing.
    const volRow = r.delivered != null ? rows[r.delivered].c : (r.shipped != null ? rows[r.shipped].c : null);
    region.volume = volRow ? {
      ytd:        cellCount(volRow[ytdCol]),
      previousFY: cellCount(volRow[finalCol])
    } : { ytd: null, previousFY: null };
    out[key] = region;
  }
  return out;
}

/* Aggregate source-region data into the public display regions (NA / LATAM / EU / APAC / ME).
   Combined % is volume-weighted: sum(pct*vol) / sum(vol). */
function buildDisplayData(sourceData) {
  const out = {};
  // Always carry through Global verbatim — used by the header summary cards.
  if (sourceData.Global) {
    out.Global = {
      key: "Global",
      label: "Global", sub: "All geographies",
      centroid: [10, 25],
      countries: [], sheetSources: ["Global"],
      cth: { ...sourceData.Global.cth }, dts: { ...sourceData.Global.dts }, cts: { ...sourceData.Global.cts },
      volume: { ...sourceData.Global.volume }
    };
  }

  for (const [regionKey, meta] of Object.entries(DISPLAY_REGIONS)) {
    const sources = meta.sheetSources.map(k => sourceData[k]).filter(Boolean);
    const region = { key: regionKey, ...meta };

    if (sources.length === 0) {
      // ME — no sheet coverage yet
      region.cth = { rolling3w: null, ytd: null, previousFY: null };
      region.dts = { rolling3w: null, ytd: null, previousFY: null };
      region.cts = { rolling3w: null, ytd: null, previousFY: null };
      region.volume = { ytd: null, previousFY: null };
      region.hasData = false;
      out[regionKey] = region;
      continue;
    }

    if (sources.length === 1) {
      const s = sources[0];
      region.cth = { ...s.cth };
      region.dts = { ...s.dts };
      region.cts = { ...s.cts };
      region.volume = { ...s.volume };
      region.hasData = (s.cth && s.cth.ytd != null);
      out[regionKey] = region;
      continue;
    }

    // Multiple source regions — aggregate using volume-weighted averaging.
    const totalVol = sources.reduce((sum, s) => sum + (s.volume?.ytd || 0), 0);
    const totalVolPrev = sources.reduce((sum, s) => sum + (s.volume?.previousFY || 0), 0);
    function weightedMetric(metric, key) {
      // Weight by source-region volume on the same time horizon, where possible.
      const weights = sources.map(s => (s.volume?.ytd || 0));
      const totalW = weights.reduce((a, b) => a + b, 0);
      if (!totalW) {
        // Volume-less case: simple average of non-null source values.
        const vals = sources.map(s => s[metric]?.[key]).filter(v => v != null);
        return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
      }
      let acc = 0, used = 0;
      sources.forEach((s, i) => {
        const v = s[metric]?.[key];
        if (v != null) { acc += v * weights[i]; used += weights[i]; }
      });
      return used ? acc / used : null;
    }
    for (const metric of ["cts","cth","dts"]) {
      region[metric] = {
        rolling3w:  weightedMetric(metric, "rolling3w"),
        ytd:        weightedMetric(metric, "ytd"),
        previousFY: weightedMetric(metric, "previousFY")
      };
    }
    region.volume = { ytd: totalVol || null, previousFY: totalVolPrev || null };
    region.hasData = region.cth.ytd != null;
    out[regionKey] = region;
  }
  return out;
}

/* ============================================================
   UI helpers
============================================================ */
function tier(pct) {
  if (pct == null) return "na";
  if (pct >= 95) return "good";
  if (pct >= 90) return "warn";
  return "bad";
}
function tierColor(t) {
  return t === "good" ? "var(--fb-good)" : t === "warn" ? "var(--fb-warn)" : t === "bad" ? "var(--fb-bad)" : "var(--fb-text-3)";
}
function tierColorRaw(t) {
  return t === "good" ? "#16b06a" : t === "warn" ? "#d59024" : t === "bad" ? "#f46e73" : "#74889d";
}
function pillLabel(t) {
  return t === "good" ? "On target" : t === "warn" ? "Watch" : t === "bad" ? "At risk" : "—";
}
function fmtPct(v) { return v == null ? "—" : (Math.round(v * 10) / 10).toFixed(1) + "%"; }
function fmtDays(v) { return v == null ? "—" : (Math.round(v * 10) / 10).toFixed(1); }

/* Parse SLO range labels like "6", "5-8", "8-15", "5–8" → {min, max} */
function parseSloRange(label) {
  if (!label) return null;
  const s = String(label).replace(/[–—]/g, "-").trim();
  const m = s.match(/(\d+(?:\.\d+)?)(?:\s*-\s*(\d+(?:\.\d+)?))?/);
  if (!m) return null;
  const min = parseFloat(m[1]);
  const max = m[2] ? parseFloat(m[2]) : min;
  return { min, max };
}

/* Render the actuals strip (avg days vs SLO target) */
function renderActualsStrip(avgDays, sloLabel, metricTitle) {
  const range = parseSloRange(sloLabel);
  // Status: under SLO min = beating, within range = on target, over max = miss
  let status = "warn", statusText = "—";
  if (range && avgDays != null) {
    if (avgDays <= range.min) {
      const pct = Math.round((1 - avgDays / range.max) * 100);
      status = "beat";
      statusText = `${pct}% faster than SLO`;
    } else if (avgDays <= range.max) {
      status = "warn"; statusText = "Within SLO range";
    } else {
      const over = (avgDays - range.max).toFixed(1);
      status = "miss"; statusText = `+${over}d over SLO`;
    }
  }

  // Bar viz: scale to max(SLO max, avg) * 1.3, mark SLO zone, plot actual.
  let barHtml = "";
  if (range) {
    const scale = Math.max(range.max, avgDays || 0) * 1.3 || 10;
    const zoneStart = (range.min / scale) * 100;
    const zoneEnd = (range.max / scale) * 100;
    const actualPos = avgDays != null ? Math.min(99, (avgDays / scale) * 100) : 0;
    barHtml = `
      <div class="days-bar">
        <div class="slo-zone" style="left:${zoneStart}%; right:${100 - zoneEnd}%;"></div>
        ${avgDays != null ? `<div class="actual-marker" style="left:calc(${actualPos}% - 1.5px);"></div>` : ""}
      </div>
      <div class="days-bar-axis"><span>0d</span><span>SLO ${sloLabel} d</span><span>${(scale).toFixed(0)}d</span></div>`;
  }

  const sloDisplay = sloLabel ? sloLabel + " days" : "—";
  return `
    <div class="actuals-strip">
      <div class="actuals-label">Actuals · ${metricTitle}</div>
      <div class="actuals-row">
        <div class="actuals-card actual">
          <div class="a-label">3-Week Avg</div>
          <div class="a-value">${fmtDays(avgDays)} <span class="a-unit">days</span></div>
          <div class="a-foot">Actual delivery time</div>
        </div>
        <div class="actuals-card">
          <div class="a-label">SLO Target</div>
          <div class="a-value">${sloDisplay}</div>
          <div class="a-foot">Promised window</div>
        </div>
        <span class="vs-pill ${status}">${statusText}</span>
      </div>
      ${barHtml}
    </div>`;
}
function fmtDelta(curr, prev) {
  if (curr == null || prev == null) return "";
  const d = curr - prev;
  if (Math.abs(d) < 0.05) return "";
  const cls = d > 0 ? "up" : "down";
  const sign = d > 0 ? "▲" : "▼";
  return `<span class="delta ${cls}">${sign} ${Math.abs(d).toFixed(1)}pp</span>`;
}
function setStatus(state, text) {
  const s = document.getElementById("status");
  s.classList.remove("loading", "error");
  if (state !== "ok") s.classList.add(state);
  document.getElementById("statusText").textContent = text;
}
let toastTimer;
function toast(msg, isError) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.toggle("error", !!isError);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}

/* TopoJSON uses ISO 3166-1 numeric IDs. Map → alpha-3. */
const NUMERIC_TO_ISO3 = {
  // North America
  840:"USA", 124:"CAN",
  // LATAM
  484:"MEX", 32:"ARG", 76:"BRA", 152:"CHL", 170:"COL", 188:"CRI", 320:"GTM",
  // Europe
  826:"GBR", 40:"AUT", 56:"BEL", 100:"BGR", 191:"HRV", 196:"CYP", 203:"CZE",
  208:"DNK", 233:"EST", 246:"FIN", 250:"FRA", 276:"DEU", 300:"GRC", 348:"HUN",
  372:"IRL", 380:"ITA", 428:"LVA", 440:"LTU", 442:"LUX", 470:"MLT", 528:"NLD",
  616:"POL", 620:"PRT", 642:"ROU", 703:"SVK", 705:"SVN", 724:"ESP", 752:"SWE",
  // APAC
  356:"IND", 392:"JPN", 458:"MYS", 608:"PHL", 702:"SGP", 410:"KOR", 554:"NZL", 36:"AUS",
  // Middle East
  784:"ARE", 376:"ISR"
};

/* ISO3 → our display country code */
const ISO3_TO_COUNTRY = {
  USA:"US", CAN:"CA",
  MEX:"MX", ARG:"AR", BRA:"BR", CHL:"CL", COL:"CO", CRI:"CR", GTM:"GT",
  GBR:"UK", AUT:"AT", BEL:"BE", BGR:"BG", HRV:"HR", CYP:"CY", CZE:"CZ",
  DNK:"DK", EST:"EE", FIN:"FI", FRA:"FR", DEU:"DE", GRC:"GR", HUN:"HU",
  IRL:"IE", ITA:"IT", LVA:"LV", LTU:"LT", LUX:"LU", MLT:"MT", NLD:"NL",
  POL:"PL", PRT:"PT", ROU:"RO", SVK:"SK", SVN:"SI", ESP:"ES", SWE:"SE",
  IND:"IN", JPN:"JP", MYS:"MY", PHL:"PH", SGP:"SG", KOR:"KR", NZL:"NZ", AUS:"AU",
  ARE:"AE", ISR:"IL"
};

/* ISO3 → display-region key (so a clicked country knows its region).
   Must be declared AFTER ISO3_TO_COUNTRY to avoid a Temporal Dead Zone ReferenceError. */
const isoToRegion = (() => {
  const m = {};
  for (const [iso3, ctry] of Object.entries(ISO3_TO_COUNTRY)) {
    const region = COUNTRY_TO_REGION[ctry];
    if (region) m[iso3] = region;
  }
  return m;
})();

let worldFeatures = null;
function drawCountries() {
  if (!worldFeatures) return;
  const sel = gCountries.selectAll("path.country").data(worldFeatures, d => d.id);
  sel.enter().append("path")
    .attr("class", d => {
      const iso = NUMERIC_TO_ISO3[+d.id];
      return iso && isoToRegion[iso] ? "country country-served" : "country country-base";
    })
    .attr("data-region", d => {
      const iso = NUMERIC_TO_ISO3[+d.id];
      return iso ? (isoToRegion[iso] || "") : "";
    })
    .attr("data-iso", d => NUMERIC_TO_ISO3[+d.id] || "")

      const region = this.getAttribute("data-region");
      const iso = this.getAttribute("data-iso");
      if (region) selectRegion(region, ISO3_TO_COUNTRY[iso]);

/* Draw a warehouse pin per city (21 pins). Color = parent region's CTH tier. */
function drawPins() {
  if (!DATA) return;
  const pins = WAREHOUSES.map(w => ({ ...w, parent: DATA[w.region] })).filter(w => w.parent);
  const g = gPins.selectAll("g.pin").data(pins, d => d.city);

  enter.append("circle").attr("class", "pin-shadow").attr("r", 3.6).attr("cy", 1);

let rotation = [-10, -20];
let autospin = true;
let lastT = 0;
d3.timer(t => {
  if (!autospin) return;
  const dt = t - lastT;
  lastT = t;
  rotation[0] += dt * 0.012;
  if (activeProjection === projection) projection.rotate(rotation);
  redraw();
});

function redraw() {
  path = d3.geoPath(activeProjection);
  gOcean.select(".ocean").attr("d", path);
  gGraticule.select(".graticule").attr("d", path);
  gCountries.selectAll("path").attr("d", path);
  gPins.selectAll("g.pin").each(function(d) {
    const coords = d.coords;
    const c = activeProjection(coords);
    const visible = isPointVisible(coords);
    d3.select(this)
      .attr("transform", c ? `translate(${c[0]},${c[1]})` : null)
      .style("display", visible && c ? null : "none");
  });
}

function isPointVisible(coord) {
  if (activeProjection !== projection) return true;
  const r = projection.rotate();
  const [lon, lat] = coord;
  const phi = lat * Math.PI/180;
  const lambda = (lon + r[0]) * Math.PI/180;
  const phi0 = -r[1] * Math.PI/180;
  const cos = Math.sin(phi0)*Math.sin(phi) + Math.cos(phi0)*Math.cos(phi)*Math.cos(lambda);
  return cos > -0.05;
}

const drag = d3.drag()
  .on("start", () => { autospin = false; setSpinBtn(); })
  .on("drag", (e) => {
    if (activeProjection !== projection) return;
    const k = 0.4;
    rotation[0] += e.dx * k;
    rotation[1] = Math.max(-80, Math.min(80, rotation[1] - e.dy * k));
    projection.rotate(rotation);
    redraw();
  });
svg.call(drag);

svg.on("wheel", (e) => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.08 : 1 / 1.08;
  activeProjection.scale(Math.max(150, Math.min(2200, activeProjection.scale() * factor)));
  redraw();
}, { passive: false });

window.addEventListener("resize", () => {
  width = window.innerWidth;
  height = window.innerHeight - 188;
  svg.attr("viewBox", `0 0 ${width} ${height}`);
  projection.translate([width/2, height/2]).scale(Math.min(width, height) * 0.42);
  flatProjection.translate([width/2, height/2]).scale(Math.min(width, height) * 0.22);
  redraw();
});

      </div>`;
    }).join("");
    const bars = cells.map(c => {
      const w = c.val == null ? 0 : Math.max(0, Math.min(100, c.val));
      return `<div class="bar-row">
        <span class="bar-row-label">${c.lab}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${w}%; background:${tierColorRaw(tier(c.val))};"></div></div>
        <span class="bar-row-value">${fmtPct(c.val)}</span>
      </div>`;
    }).join("");

    // Actuals strip (CTH only for now — CTS/DTS will follow)
    const actualsHtml = (m === "cth" && v.avgDays != null)
      ? renderActualsStrip(v.avgDays, v.sloDaysLabel, "Click-to-Home")
      : "";

    // Region-specific SLO text in head pill (for CTH if we have a region label)
    const sloRange = (m === "cth" && v.sloDaysLabel) ? v.sloDaysLabel + " business days" : def.slo.range;

    return `<div class="metric-block ${m}">
      <div class="metric-head">
        <div class="metric-title-row">
          <div>
            <div class="metric-title">${def.title}<span class="short">(${def.short})</span></div>
            <div class="metric-desc">${def.desc}</div>
          </div>
        </div>
        <div class="metric-slo">SLO: <b>${sloRange}</b> · Goal <b>${def.slo.goal}</b></div>
      </div>
      ${actualsHtml}
      <div class="metric-grid">${cellsHtml}</div>
      <div class="bar-block">
        ${bars}
        <div class="bar-target-label">↑ 95% SLO goal</div>
      </div>
    </div>`;
  }).join("");
  const ctyList = (r.countries || []).map(c =>
    `<span class="country-chip${focusCountry === c ? " active" : ""}">${COUNTRY_NAMES[c] || c}</span>`).join("");
  const whList = warehousesForRegion.map(w =>
    `<div class="wh-item${focusCity === w.city ? " active" : ""}"><span class="wh-pin">${iconBox()}</span><div><b>${w.city}</b><span class="wh-country">${COUNTRY_NAMES[w.country] || w.country}</span></div></div>`).join("");
  const extras = `
    <div class="metric-block">
      <div class="region-extras">
        <div class="extras-head">Countries served (${r.countries?.length || 0})</div>
        <div class="country-chips">${ctyList}</div>
        <div class="extras-head">Warehouses (${warehousesForRegion.length})</div>
        <div class="wh-list">${whList}</div>
      </div>
    </div>`;

  document.getElementById("metricsBody").innerHTML = volumeBlock + html + extras;
  panel.classList.add("open");
  panel.setAttribute("aria-hidden", "false");

  if (activeProjection === projection) {
    autospin = false; setSpinBtn();
    const target = [-r.centroid[0], -r.centroid[1]];
    d3.transition().duration(900).tween("rotate", () => {
      const interp = d3.interpolate(rotation, target);
      return tt => {
        rotation = interp(tt);
        projection.rotate(rotation);
        redraw();
      };
    });
  }
}

/* ============================================================
   Controls
============================================================ */
function setSpinBtn() {
  document.querySelector('button[data-spin="toggle"]').classList.toggle("active", autospin);
}
document.querySelectorAll('button[data-view]').forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll('button[data-view]').forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeProjection = btn.dataset.view === "globe" ? projection : flatProjection;
    redraw();
  });
});
document.querySelector('button[data-spin="toggle"]').addEventListener("click", () => {
  autospin = !autospin;
  setSpinBtn();
});
setSpinBtn();

document.getElementById("refreshBtn").addEventListener("click", () => loadData(true));

/* ============================================================
   Boot: load world map + sheet data
============================================================ */
const WORLD_URL = "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json";
d3.json(WORLD_URL).then(world => {
  worldFeatures = topojson.feature(world, world.objects.countries).features;
  drawCountries();
  redraw();
});

async function loadData(isRefresh) {
  setStatus("loading", isRefresh ? "Refreshing…" : "Loading sheet…");
  document.getElementById("lastUpdated").textContent = "Connecting to source…";
  if (!DATA) renderSummary(); // skeletons

  try {
    console.info("[SLO] Fetching gviz JSONP for sheet", SHEET_ID, "gids:", GID, GID_CTH_AVG);
    const [sloPayload, cthAvgPayload] = await Promise.all([
      fetchSheetJSONP(GID),
      fetchSheetJSONP(GID_CTH_AVG).catch(err => {
        console.warn("[SLO] CTH averages fetch failed (non-fatal):", err);
        return null;
      })
    ]);
    console.info("[SLO] Main payload:", {
      status: sloPayload.status, cols: sloPayload.table?.cols?.length, rows: sloPayload.table?.rows?.length
    });
    if (cthAvgPayload) console.info("[SLO] CTH averages payload:", {
      status: cthAvgPayload.status, rows: cthAvgPayload.table?.rows?.length
    });
    const sourceData = extractDataFromJSON(sloPayload);
    mergeCTHAverages(sourceData, cthAvgPayload);
    if (sourceData.Global?.cth?.ytd == null) {
      console.warn("[SLO] Source data:", sourceData);
      throw new Error("Global CTH YTD missing — sheet structure may have changed");
    }
    const data = buildDisplayData(sourceData);
    mergeCTHAveragesForDisplay(data, sourceData);
    DATA = data;
    console.info("[SLO] Display data:", data);
    renderSummary();
    drawPins();
    redraw();
    const now = new Date();
    document.getElementById("lastUpdated").textContent =
      `Live · Updated ${now.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"})} · ${now.toLocaleDateString([], {month: "short", day: "numeric", year: "numeric"})}`;
    setStatus("ok", "Live");
    if (isRefresh) toast("Data refreshed");
  } catch (err) {
    console.error("[SLO] loadData failed:", err);
    setStatus("error", "Connection failed");
    document.getElementById("lastUpdated").textContent = "Source unavailable — " + err.message;
    toast("Couldn't load sheet: " + err.message, true);
  }
}
loadData(false);
</script>
